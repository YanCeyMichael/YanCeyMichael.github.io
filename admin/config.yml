# 认证由 aiyancey.com 的区域 Worker 自定义域处理。
# GitHub App 登录由 Cloudflare Worker 处理；此文件不得放 Client Secret、私钥或 PAT。
backend:
  name: github
  repo: YanCeyMichael/YanCeyBlog-Source
  branch: main
  base_url: https://auth.aiyancey.com
  auth_endpoint: auth

publish_mode: simple
# Sveltia keeps these compatibility paths for existing entries and previews.
# The admin shell routes media navigation and editor image actions through the
# Worker-backed imagesforblogs media library.
media_folder: source/images
public_folder: /images
output:
  omit_empty_optional_fields: true
slug:
  encoding: unicode

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: source/_posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: 标题, name: title, widget: string }
      - { label: 发布日期, name: date, widget: datetime }
      - label: 标签
        name: tags
        widget: list
        required: false
        label_singular: 标签
        allow_add: true
        allow_duplicate: false
        hint: 点击“标签”添加；输入时可以从已有标签中选择。
        field:
          label: 标签
          name: tag
          widget: string
      - label: 正文
        name: body
        widget: richtext
        modes: [raw]
        sanitize_preview: true
        hint: 支持 Markdown。右侧会同步显示 Yilia 阅读预览。

  - name: site
    label: 站点内容
    files:
      - label: About Me
        name: about
        file: source/_data/about.yml
        fields:
          - label: 个人简介
            name: bio
            widget: text
            required: true
            hint: 访客可见；最多 100 字。提交后写回站点内容并触发发布。
            pattern: ['^[\s\S]{1,100}$', '简介需填写且不能超过 100 字']

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f4f5f6">
    <title>博客内容管理 · Yancey’s Blog</title>
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
    <script type="importmap">
      {
        "imports": {
          "https://unpkg.com/immutable@5.1.9/dist/immutable.es.js": "/admin/vendor/sveltia-cms-0.261.0/immutable.es.js"
        }
      }
    </script>
    <link rel="stylesheet" href="/admin/admin-shell.css?v=3.3.4">
  </head>
  <body>
    <div class="studio-shell">
      <div class="admin-workspace" id="admin-workspace">
        <aside class="admin-side" aria-label="管理导航">
          <a class="studio-brand" href="/" aria-label="返回 Yancey’s Blog 首页">
            <img class="studio-avatar" src="/images/avatar-yancey-cat.jpg" width="512" height="512" decoding="async" alt="">
            <span class="brand-copy"><strong>Yancey’s Blog</strong><small>内容工作台</small></span>
          </a>
          <div class="admin-nav-label">工作区</div>
          <nav class="admin-nav">
            <a class="active" href="/admin/#/collections/posts" data-label="文章">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M16 4v4h4M8 11h8M8 15h8"/></svg>
              </span>
              <span class="nav-text">文章</span>
            </a>
            <a href="/admin/#/assets" data-label="媒体库">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m7 16 3.4-3.8 2.8 2.5 2.2-2.7L19 16M8 9h.01"/></svg>
              </span>
              <span class="nav-text">媒体库</span>
            </a>
            <a href="/admin/#/collections/site/entries/about" data-label="关于我">
              <span class="nav-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 19c.8-3.3 3-5 6.5-5s5.7 1.7 6.5 5"/></svg>
              </span>
              <span class="nav-text">关于我</span>
            </a>
          </nav>
          <div class="sidebar-foot">
            <a class="foot-link" href="/" data-label="查看博客">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M4.5 12h15M12 4c2.4 2.3 3.5 5 3.5 8s-1.1 5.7-3.5 8c-2.4-2.3-3.5-5-3.5-8s1.1-5.7 3.5-8Z"/></svg>
              <span class="nav-text">查看博客</span>
            </a>
          </div>
        </aside>
        <button class="workspace-toggle" id="workspace-toggle" type="button" aria-label="收起侧边栏" aria-expanded="true" data-tooltip="收起侧栏  ⌘ \">
          <svg class="toggle-close-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/><path d="m15 9-3 3 3 3"/></svg>
          <svg class="toggle-open-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/><path d="m13 9 3 3-3 3"/></svg>
          <svg class="toggle-menu-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="admin-scrim" id="admin-scrim" type="button" aria-label="关闭导航" hidden></button>
        <main id="nc-root" aria-label="博客内容管理工作区"></main>
      </div>
    </div>
    <script>window.CMS_MANUAL_INIT = true;</script>
    <script type="module" src="/admin/admin-sveltia.js?v=1.7.2"></script>
  </body>
</html>
